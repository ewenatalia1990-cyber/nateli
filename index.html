<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Книга правил — Дядя Жора</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #14100d;
      --surface: #1f1814;
      --surface-2: #2a201a;
      --border: rgba(224, 168, 84, 0.22);
      --gold: #e0a854;
      --gold-bright: #f6cd84;
      --text: #f5efe6;
      --muted: #b8a797;
      --accent-green: #58c98a;
      --accent-red: #e86a5e;
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0 14px 36px;
      background: radial-gradient(circle at 18% 0%, rgba(224, 168, 84, 0.14), transparent 46%),
                  radial-gradient(circle at 88% 12%, rgba(168, 92, 38, 0.12), transparent 40%),
                  var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.48;
      min-height: 100vh;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    /* Header */
    .hero {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 4px 14px;
    }

    .avatar-ring {
      flex: 0 0 68px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--gold-bright), #8b5620);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .hero-text h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--gold-bright);
    }

    .hero-text p {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* Filter Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .tab.active {
      background: linear-gradient(135deg, #e0a854, #b7772a);
      color: #16100c;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(224, 168, 84, 0.28);
    }

    /* Cards */
    .list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s ease, transform 0.15s ease;
    }

    .card.open {
      border-color: rgba(246, 205, 132, 0.52);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
    }

    .card-head {
      width: 100%;
      background: transparent;
      border: 0;
      color: inherit;
      text-align: left;
      padding: 14px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .icon-box {
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .head-main {
      flex: 1;
      min-width: 0;
    }

    .head-title {
      font-size: 16px;
      font-weight: 750;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .head-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .chev {
      font-size: 13px;
      color: var(--gold);
      transition: transform 0.2s ease;
      padding-left: 4px;
    }

    .card.open .chev {
      transform: rotate(180deg);
    }

    .card-body {
      display: none;
      padding: 0 15px 16px;
      border-top: 1px solid rgba(224, 168, 84, 0.12);
    }

    .card.open .card-body {
      display: block;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }

    .pill {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cmd-btn {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(224, 168, 84, 0.16);
      color: var(--gold-bright);
      border: 1px solid rgba(224, 168, 84, 0.45);
      cursor: pointer;
    }

    .quote-box {
      background: rgba(224, 168, 84, 0.08);
      border-left: 3px solid var(--gold);
      border-radius: 0 10px 10px 0;
      padding: 10px 12px;
      font-size: 13.5px;
      margin: 10px 0 12px;
      color: var(--text);
    }

    .sec-title {
      font-size: 13px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--gold);
      margin: 12px 0 6px;
    }

    .steps {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13.5px;
    }

    .steps li {
      background: rgba(255, 255, 255, 0.025);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .rewards {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .reward-pill {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(88, 201, 138, 0.12);
      color: #a9f0c8;
      border: 1px solid rgba(88, 201, 138, 0.28);
    }

    .tip {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
    }

    /* Notebook traits */
    .trait-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .trait-item {
      background: rgba(255, 255, 255, 0.025);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
    }

    .trait-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 5px;
    }

    .bar > span {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #b7772a, #f6cd84);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%) translateY(20px);
      background: #2f231b;
      color: var(--gold-bright);
      border: 1px solid var(--gold);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

              <div class="trait-top"><span>🤝 Доверие</span><span>Карма</span></div>
              <div class="bar"><span style="width:85%"></span></div>
              Растёт за честный делёж и падает за предательства. Ниже 30% — Жора предупреждает стол!
            </div>
          </div>
          <div class="sec-title">Популярные титулы</div>
          <div class="rewards">
            <span class="reward-pill">🔥 Душа тусовки (Вайб + Доверие)</span>
            <span class="reward-pill">🎭 Стендапер-шулер (Юмор + Хитрость)</span>
            <span class="reward-pill">🔍 Детектор лжи (Чутьё + Доверие)</span>
            <span class="reward-pill">🐍 Крыса в законе (Хитрость + низкое Доверие)</span>
          </div>
          <div class="tip">💡 Фишки можно тратить в /shop на значок у ника (🎩 🥃 🎭 👑) или «откуп от позора» (+15% к Доверию).</div>
        </div>
      </article>
    `;

    let activeCat = "all";
    let openKey = null;

    const params = new URLSearchParams(window.location.search);
    const initialGame = (params.get("game") || window.location.hash.replace("#", "") || "").toLowerCase();
    if (initialGame === "notebook") {
      activeCat = "notebook";
      openKey = "notebook";
    } else if (GAMES.some(g => g.key === initialGame)) {
      openKey = initialGame;
    }

    const cardsEl = document.getElementById("cards");
    const tabsEl = document.getElementById("tabs");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;

    function haptic() {
      try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    function copyText(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).catch(() => {});
      }
      haptic();
      showToast("Команда " + txt + " скопирована!");
    }

    function render() {
      if (activeCat === "notebook") {
        cardsEl.innerHTML = NOTEBOOK_HTML;
        bindEvents();
        return;
      }
      const list = activeCat === "all" ? GAMES : GAMES.filter(g => g.cat.includes(activeCat));
      cardsEl.innerHTML = list.map(g => {
        const isOpen = openKey === g.key;
        return `
          <article class="card ${isOpen ? "open" : ""}" data-key="${g.key}">
            <button class="card-head" type="button">
              <div class="icon-box">${g.icon}</div>
              <div class="head-main">
                <div class="head-title">${g.title}</div>
                <div class="head-sub">${g.sub}</div>
              </div>
              <span class="chev">▼</span>
            </button>
            <div class="card-body">
              <div class="meta-row">
                <span class="pill">👥 ${g.players}</span>
                <span class="pill">⏱ ${g.time}</span>
                <span class="pill">📩 ${g.dm}</span>
                <button class="cmd-btn" data-copy="${g.cmd}">📋 ${g.cmd}</button>
              </div>
              <div class="quote-box">🎯 <b>Суть:</b> ${g.essence}</div>
              <div class="sec-title">Как проходит игра</div>
              <ul class="steps">
                ${g.steps.map(s => `<li>${s}</li>`).join("")}
              </ul>
              <div class="sec-title">Награды в Чёрную тетрадку</div>
              <div class="rewards">
                ${g.rewards.map(r => `<span class="reward-pill">${r}</span>`).join("")}
              </div>
              <div class="tip">💡 Совет Дяди Жоры: ${g.tip}</div>
            </div>
          </article>
        `;
      }).join("");
      bindEvents();
    }

    function bindEvents() {
      cardsEl.querySelectorAll(".card-head").forEach(btn => {
        btn.addEventListener("click", () => {
          const card = btn.closest(".card");
          const key = card.dataset.key;
          haptic();
          if (key === "notebook") {
            card.classList.toggle("open");
            return;
          }
          openKey = (openKey === key) ? null : key;
          render();
        });
      });
      cardsEl.querySelectorAll(".cmd-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          copyText(btn.dataset.copy);
        });
      });
    }

    tabsEl.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        haptic();
        tabsEl.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeCat = tab.dataset.cat;
        render();
      });
    });

    if (activeCat !== "all") {
      tabsEl.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.cat === activeCat);
      });
    }
    render();
    if (openKey) {
      const target = cardsEl.querySelector(`[data-key="${openKey}"]`);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  </script>
</body>
</html>
